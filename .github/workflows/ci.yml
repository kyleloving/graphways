name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (no network feature)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Clippy (Python extension)
        run: cargo clippy --all-targets --features extension-module -- -D warnings

      - name: Test (unit, randomized cross-checks, doc tests)
        run: cargo test

      - name: Test without the network feature
        run: cargo test --no-default-features

      - name: Rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Runs the Munich pipeline end to end and checks every route against
      # Dijkstra; timings land in the job log.
      - name: Pipeline benchmark (driving)
        run: cargo bench --bench pipeline
        env:
          VERIFY: "1"

  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --features extension-module

      - name: Python API smoke tests
        run: |
          pip install --force-reinstall --no-deps target/wheels/*.whl
          python -m unittest discover -s tests -p "test_*.py"
